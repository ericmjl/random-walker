name: RandomWalker
options:
  bundleIdPrefix: dev.ericmjl
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: 1.0.0

targets:
  RandomWalkerCore:
    type: framework
    platform: iOS
    supportedDestinations: [iOS, watchOS]
    sources:
      - path: RandomWalkerCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericmjl.randomwalker.core
      GENERATE_INFOPLIST_FILE: YES
      BUILD_LIBRARY_FOR_DISTRIBUTION: YES
      SKIP_INSTALL: YES

  RandomWalker:
    type: application
    platform: iOS
    sources:
      - path: RandomWalker
    dependencies:
      - target: RandomWalkerCore
      # Watch app is a separate target/scheme so iOS Simulator builds do not
      # require a matching watchOS simulator runtime.
    settings:
      DEVELOPMENT_TEAM: 2GY49RTSYX
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericmjl.randomwalker
      INFOPLIST_FILE: RandomWalker/Info.plist
      GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: RandomWalker/RandomWalker.entitlements
      properties:
        com.apple.developer.healthkit: true
    scheme:
      testTargets:
        - RandomWalkerCoreTests

  RandomWalkerWatch:
    type: application
    platform: watchOS
    sources:
      - path: RandomWalkerWatch
    dependencies:
      - target: RandomWalkerCore
        embed: true
    settings:
      DEVELOPMENT_TEAM: 2GY49RTSYX
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericmjl.randomwalker.watchkitapp
      INFOPLIST_FILE: RandomWalkerWatch/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      # Required so the Swift debug dylib can resolve @rpath-linked embedded frameworks.
      LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - '@executable_path/Frameworks'
        - '@loader_path/Frameworks'

  RandomWalkerCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RandomWalkerCoreTests
    dependencies:
      - target: RandomWalkerCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericmjl.randomwalker.core.tests
      GENERATE_INFOPLIST_FILE: YES

schemes:
  RandomWalker:
    build:
      targets:
        RandomWalker: all
        RandomWalkerCore: all
    test:
      targets:
        - RandomWalkerCoreTests
    run:
      config: Debug
  RandomWalkerWatch:
    build:
      targets:
        RandomWalkerWatch: all
        RandomWalkerCore: all
    run:
      config: Debug

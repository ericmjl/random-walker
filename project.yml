name: RandomWalker
options:
  bundleIdPrefix: dev.ericmjl
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: 1.0.0

packages:
  # Multi-platform library; Xcode-native “one framework, two SDKs” struggled with explicit modules + embedded Watch.
  RandomWalkerCoreSPM:
    path: .

targets:
  RandomWalker:
    type: application
    platform: iOS
    sources:
      - path: RandomWalker
    dependencies:
      - package: RandomWalkerCoreSPM
        product: RandomWalkerCore
      # Embedding registers the companion app with WatchConnectivity (`WCSession` otherwise reports
      # “Watch app is not installed.” for `updateApplicationContext` on Simulator).
      - target: RandomWalkerWatch
        embed: true
    settings:
      DEVELOPMENT_TEAM: 2GY49RTSYX
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericmjl.randomwalker
      INFOPLIST_FILE: RandomWalker/Info.plist
      GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: RandomWalker/RandomWalker.entitlements
      properties:
        com.apple.developer.healthkit: true
    scheme:
      testTargets:
        - RandomWalkerCoreTests

  RandomWalkerWatch:
    type: application
    platform: watchOS
    sources:
      - path: RandomWalkerWatch
    dependencies:
      - package: RandomWalkerCoreSPM
        product: RandomWalkerCore
    settings:
      DEVELOPMENT_TEAM: 2GY49RTSYX
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericmjl.randomwalker.watchkitapp
      INFOPLIST_FILE: RandomWalkerWatch/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - '@executable_path/Frameworks'
        - '@loader_path/Frameworks'

  RandomWalkerCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RandomWalkerCoreTests
    dependencies:
      - package: RandomWalkerCoreSPM
        product: RandomWalkerCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.ericmjl.randomwalker.core.tests
      GENERATE_INFOPLIST_FILE: YES

schemes:
  RandomWalker:
    build:
      targets:
        RandomWalker: all
    test:
      targets:
        - RandomWalkerCoreTests
    run:
      config: Debug
  RandomWalkerWatch:
    build:
      targets:
        RandomWalkerWatch: all
    run:
      config: Debug
